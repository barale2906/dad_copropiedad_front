# Referencia para los servidores (HestiaCP) y para `make preview`.
# Copie las directivas de `location` en la plantilla Nginx del dominio.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Archivos con hash en el nombre: caché de un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Configuración por ambiente y página de entrada: siempre frescas.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Router en modo history: toda ruta desconocida vuelve a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
